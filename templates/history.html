<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fashion Flair Hub - Search History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Italianno&display=swap" rel="stylesheet">

</head>
<body class="bg-gradient-to-br from-yellow-900 via-yellow-600 to-yellow-100 min-h-screen p-6 font-sans">

  <div class="max-w-6xl mx-auto bg-gray-900 p-8 rounded-xl shadow-2xl">
    <h1 class="text-7xl font-bold text-center text-yellow-400 mb-8" style="font-family: 'Italianno', cursive;">Search History - Fashion Flair Hub</h1>

    <!-- Search Inputs -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-10">
      <!-- Text Search -->
      <div>
        <label class="block font-semibold text-gray-100 mb-1">Text Search</label>
        <input type="text" id="textSearch" placeholder="Enter fashion keyword"
          class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring focus:ring-yellow-200">
      </div>

      <!-- Image Search -->
      <div>
        <label class="block font-semibold text-gray-100 mb-1">Image Search</label>
        <input type="file" id="imageSearch" accept="image/*"
          class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:border-0 file:text-sm file:bg-yellow-400 file:text-yellow-700 file:rounded-md hover:file:bg-purple-200">
      </div>

      <!-- Voice Search -->
      <div>
        <label class="block font-semibold text-gray-100 mb-1">Voice Search</label>
        <div class="flex space-x-2">
          <input type="text" id="voiceSearch" placeholder="Speak to search" readonly
            class="flex-1 px-4 py-2 border rounded-lg shadow-sm focus:ring focus:ring-yellow-200">
          <button onclick="startVoiceSearch()" title="Speak"
            class="px-4 py-2 bg-yellow-400 text-white rounded-lg hover:bg-yellow-700 transition">🎤</button>
        </div>
      </div>

      <!-- Date -->
      <div>
        <label class="block font-semibold text-gray-100 mb-1">Search Date</label>
        <input type="date" id="searchDate"
          class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring focus:ring-yellow-200">
      </div>

      <!-- Submit Button -->
      <div class="md:col-span-2 lg:col-span-1 flex items-end">
        <button onclick="addSearch()"
          class="w-full bg-gradient-to-r from-yellow-300 to-yellow-800 text-white font-semibold py-2 px-4 rounded-lg shadow hover:opacity-90 transition">
          ➕ Add to History
        </button>
      </div>
    </div>

    <!-- History Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white rounded-xl shadow">
        <thead class="bg-yellow-400 text-black-800 font-semibold">
          <tr>
            <th class="py-3 px-4 text-left">Text Search</th>
            <th class="py-3 px-4 text-left">Image File</th>
            <th class="py-3 px-4 text-left">Voice Search</th>
            <th class="py-3 px-4 text-left">Date</th>
          </tr>
        </thead>
        <tbody id="historyTable" class="text-gray-700">
          <!-- Dynamic rows will be added here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function startVoiceSearch() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.start();

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById("voiceSearch").value = transcript;
      };
    }

    function addSearch() {
      const text = document.getElementById("textSearch").value;
      const imageFile = document.getElementById("imageSearch").files[0]?.name || '';
      const voice = document.getElementById("voiceSearch").value;
      const date = document.getElementById("searchDate").value;

      if (!text && !imageFile && !voice && !date) return;

      const table = document.getElementById("historyTable");
      const newRow = document.createElement("tr");

      [text, imageFile, voice, date].forEach(content => {
        const cell = document.createElement("td");
        cell.textContent = content;
        cell.contentEditable = true;
        cell.className = "py-3 px-4 border-b border-gray-200 bg-white hover:bg-purple-50 transition";
        newRow.appendChild(cell);
      });

      table.appendChild(newRow);

      // Clear inputs
      document.getElementById("textSearch").value = '';
      document.getElementById("imageSearch").value = '';
      document.getElementById("voiceSearch").value = '';
      document.getElementById("searchDate").value = '';
    }
  </script>

</body>
</html>
