<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-yellow-500 to-yellow-800">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 border border-yellow-500">
        <h2 class="text-3xl font-extrabold text-center text-yellow-700 uppercase">Fashion Hub</h2>
        <p class="text-center text-yellow-600 mb-6">Style your way in!</p>
        
        <form>
            <div class="mb-4">
                <label class="block text-yellow-700 font-semibold mb-2">Email</label>
                <input type="email" placeholder="Enter your email" class="w-full px-4 py-3 border border-yellow-400 rounded-full focus:outline-none focus:ring-2 focus:ring-yellow-500">
            </div>
            <div class="mb-4">
                <label class="block text-yellow-700 font-semibold mb-2">Password</label>
                <input type="password" placeholder="Enter your password" class="w-full px-4 py-3 border border-yellow-400 rounded-full focus:outline-none focus:ring-2 focus:ring-yellow-500">
            </div>
            <button class="w-full bg-yellow-600 text-white font-bold py-3 rounded-full hover:bg-yellow-700 transition">Login</button>
        </form>
        
        <div class="text-center my-4">
            <a href="#" class="text-yellow-600 hover:text-yellow-800 text-sm font-semibold">Forgot Password?</a>
        </div>
        
        
        <div class="flex justify-center mt-4 gap-6">
            <a href="#" class="text-yellow-600 hover:text-yellow-800 text-3xl">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="text-yellow-600 hover:text-yellow-800 text-3xl">
                <i class="fab fa-facebook"></i>
            </a>
            <a href="#" class="text-yellow-600 hover:text-yellow-800 text-3xl">
                <i class="fab fa-youtube"></i>
            </a>
        </div>
    </div>
    
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
