<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Fashion Flair Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class=" min-h-screen flex items-center justify-center font-sans">

  <div class="bg-gradient-to-r from-white to-yellow-600 p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <h2 class="text-3xl font-bold text-center text-gray-900 mb-6">Join Fashion Flair Hub 👗</h2>
    
    <form action="#" method="POST" class="space-y-5">
      <!-- Full Name -->
      <div>
        <label for="fullname" class="block text-sm font-medium text-gray-900">Full Name</label>
        <input type="text" id="fullname" name="fullname" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-900">Email Address</label>
        <input type="email" id="email" name="email" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-900">Password</label>
        <input type="password" id="password" name="password" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
      </div>

      <!-- Gender -->
      <div>
        <label for="gender" class="block text-sm font-medium text-gray-900">Gender</label>
        <select id="gender" name="gender" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option>Prefer not to say</option>
          <option>Female</option>
          <option>Male</option>
          <option>Other</option>
        </select>
      </div>

      <!-- Style Preference -->
     

      <!-- Submit -->
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">Create Account</button>
    </form>

    <p class="mt-5 text-center text-sm text-gray-600">Already have an account? <a href="#" class="text-indigo-600 font-semibold hover:underline">Login here</a></p>
  </div>

</body>
</html>
