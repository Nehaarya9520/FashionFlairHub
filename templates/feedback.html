<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fashion Flair Hub Feedback Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-100 text-gray-800 p-6 font-sans">
  <div class="max-w-5xl mx-auto bg-yellow-500 p-8 rounded-xl shadow-lg">
    <h1 class="text-3xl font-bold mb-6 text-center text-gray-900">Fashion Flair Hub - Feedback Form</h1>

    <!-- General Info -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div>
        <label class="block mb-2 font-semibold">Name:</label>
        <input type="text" class="w-full p-2 border rounded-md" placeholder="Enter your name" />
      </div>
  
    </div>

    <!-- Section 1: Usability -->
    <h2 class="text-xl font-semibold mb-4 text-gray-900">1. Platform Usability</h2>
    <div class="space-y-4 mb-6">
      <div class="grid grid-cols-5 gap-4 font-medium text-center">
        <span class="text-left">Criteria</span>
        <span>Excellent</span><span>Good</span><span>Fair</span><span>Poor</span>
      </div>

      <div class="grid grid-cols-5 gap-4 items-center">
        <label>User Interface</label>
        <input type="radio" name="ui" class="mx-auto"><input type="radio" name="ui" class="mx-auto"><input type="radio" name="ui" class="mx-auto"><input type="radio" name="ui" class="mx-auto">
      </div>

      <div class="grid grid-cols-5 gap-4 items-center">
        <label>Navigation</label>
        <input type="radio" name="nav" class="mx-auto"><input type="radio" name="nav" class="mx-auto"><input type="radio" name="nav" class="mx-auto"><input type="radio" name="nav" class="mx-auto">
      </div>

      <div class="grid grid-cols-5 gap-4 items-center">
        <label>Search Features (text/image/voice)</label>
        <input type="radio" name="search" class="mx-auto"><input type="radio" name="search" class="mx-auto"><input type="radio" name="search" class="mx-auto"><input type="radio" name="search" class="mx-auto">
      </div>

      <div class="grid grid-cols-5 gap-4 items-center">
        <label>Mobile Responsiveness</label>
        <input type="radio" name="mobile" class="mx-auto"><input type="radio" name="mobile" class="mx-auto"><input type="radio" name="mobile" class="mx-auto"><input type="radio" name="mobile" class="mx-auto">
      </div>
    </div>

    <!-- Section 2: Features & Innovation -->
    <h2 class="text-xl font-semibold mb-4 text-gray-900">2. Features & Innovation</h2>
    <div class="space-y-4 mb-6">
      <div class="grid grid-cols-5 gap-4 items-center">
        <label>Smart Outfit Suggestions</label>
        <input type="radio" name="smart" class="mx-auto"><input type="radio" name="smart" class="mx-auto"><input type="radio" name="smart" class="mx-auto"><input type="radio" name="smart" class="mx-auto">
      </div>

      <div class="grid grid-cols-5 gap-4 items-center">
        <label>Platform Uniqueness</label>
        <input type="radio" name="unique" class="mx-auto"><input type="radio" name="unique" class="mx-auto"><input type="radio" name="unique" class="mx-auto"><input type="radio" name="unique" class="mx-auto">
      </div>

      <div class="grid grid-cols-5 gap-4 items-center">
        <label>Fashion Content Quality</label>
        <input type="radio" name="quality" class="mx-auto"><input type="radio" name="quality" class="mx-auto"><input type="radio" name="quality" class="mx-auto"><input type="radio" name="quality" class="mx-auto">
      </div>
    </div>

    <!-- Section 3: Team Contribution -->
    <h2 class="text-xl font-semibold mb-4 text-gray-900">3. Team Contribution</h2>
    <div class="mb-6">
      <table class="w-full border text-sm text-center">
        <thead>
          <tr class="bg-gray-100">
            <th class="p-2 border">Member</th>
            <th class="p-2 border">Clear Contribution</th>
            <th class="p-2 border">Strong Effort</th>
            <th class="p-2 border">Needs Improvement</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="p-2 border">Neha Arya</td>
            <td><input type="radio" name="neha" class="mx-auto"></td>
            <td><input type="radio" name="neha" class="mx-auto"></td>
            <td><input type="radio" name="neha" class="mx-auto"></td>
          </tr>
          <tr>
            <td class="p-2 border">Jaya Kumari</td>
            <td><input type="radio" name="jaya" class="mx-auto"></td>
            <td><input type="radio" name="jaya" class="mx-auto"></td>
            <td><input type="radio" name="jaya" class="mx-auto"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Section 4: Suggestions -->
    <h2 class="text-xl font-semibold mb-4 text-gray-900">4. Suggestions / Comments</h2>
    <textarea class="w-full h-32 p-3 border rounded-md mb-6" placeholder="Write your feedback here..."></textarea>

    <!-- Section 5: Overall Rating -->
    <h2 class="text-xl font-semibold mb-4 text-gray-900">5. Overall Rating</h2>
    <div class="flex gap-4 mb-8">
      <label><input type="radio" name="overall" class="mr-1"> Excellent</label>
      <label><input type="radio" name="overall" class="mr-1"> Good</label>
      <label><input type="radio" name="overall" class="mr-1"> Average</label>
      <label><input type="radio" name="overall" class="mr-1"> Needs Improvement</label>
    </div>

    <!-- Submit -->
    <div class="text-center">
      <button class="bg-yellow-900 hover:bg-gray-900 text-white px-8 py-2 rounded-lg shadow-md transition">
        Hey! Submit Your Feedback
      </button>
    </div>
  </div>
</body>
</html>
